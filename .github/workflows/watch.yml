name: Gulf Storm Watch

on:
  schedule:
    - cron: '7 * * * *' # hourly, a few minutes past the hour
  workflow_dispatch:
    inputs:
      test_notify:
        description: Send a test notification instead of running a check
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: ${{ !inputs.test_notify }}
        with:
          python-version: '3.12'
          cache: pip
      - name: European ensemble tracks (optional layer)
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        run: pip install -q -r requirements.txt && python ecmwf_tracks.py
      - name: Check NHC and update status
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PLAYS_JSON: ${{ secrets.PLAYS_JSON }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          PUBLIC_NTFY_TOPIC: ${{ vars.PUBLIC_NTFY_TOPIC }}
          PUSH_API: ${{ vars.PUSH_API }}
          PUSH_ADMIN_KEY: ${{ secrets.PUSH_ADMIN_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
      - name: Share preview image (optional)
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        run: pip install -q playwright && playwright install --with-deps chromium >/dev/null && python card_shot.py
      - name: Give the preview image a fresh address
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        # Phones cache link-preview images by address, so each redraw gets a new one.
        run: sed -i -E 's#(main/card\.png)(\?v=[0-9]+)?"#\1?v='"$(date +%s)"'"#' index.html
      - name: Commit updated data
        run: |
          git config user.name "gulf-storm-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data card.png index.html 2>/dev/null || git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "check $(date -u +%Y-%m-%dT%H:%MZ)"
          # Someone else may have pushed while this check ran; replay on top and retry rather than fail.
          for attempt in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase -X theirs || { git rebase --abort; sleep 5; }
          done
          exit 1

  # Publish the refreshed card and data. Shares the "pages" queue with pages.yml so publishes never collide.
  publish:
    needs: check
    if: ${{ !inputs.test_notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
