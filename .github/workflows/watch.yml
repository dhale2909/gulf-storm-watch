name: Gulf Storm Watch

on:
  schedule:
    - cron: '7 * * * *' # hourly, a few minutes past the hour
  workflow_dispatch:
    inputs:
      test_notify:
        description: Send a test notification instead of running a check
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Check NHC and update status
        timeout-minutes: 5
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PLAYS_JSON: ${{ secrets.PLAYS_JSON }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          PUBLIC_NTFY_TOPIC: ${{ vars.PUBLIC_NTFY_TOPIC }}
          PUSH_API: ${{ vars.PUSH_API }}
          PUSH_ADMIN_KEY: ${{ secrets.PUSH_ADMIN_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
      - name: Save the core reading first
        if: ${{ !inputs.test_notify }}
        run: bash scripts/save.sh data
      - uses: actions/setup-python@v5
        if: ${{ !inputs.test_notify }}
        with:
          python-version: '3.12'
          cache: pip
      - name: European ensemble tracks (optional layer)
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        timeout-minutes: 4
        run: pip install -q -r requirements.txt && python ecmwf_tracks.py
      - name: Share preview image (optional)
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        timeout-minutes: 4
        run: pip install -q playwright && playwright install --with-deps chromium >/dev/null && python card_shot.py
      - name: Give the preview image a fresh address
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        # Phones cache link-preview images by address, so each redraw gets a new one. Only when a card was actually drawn.
        run: test -n "$(git status --porcelain card.png)" && sed -i -E 's#(main/card\.png)(\?v=[0-9]+)?"#\1?v='"$(date +%s)"'"#' index.html || true
      - name: Save the optional assets
        if: ${{ !inputs.test_notify }}
        run: bash scripts/save.sh data card.png index.html

  # Publish the refreshed card and data. Shares the "pages" queue with pages.yml so publishes never collide.
  publish:
    needs: check
    if: ${{ !inputs.test_notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
