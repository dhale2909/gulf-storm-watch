name: Gulf Storm Watch

on:
  schedule:
    - cron: '7 * * * *' # hourly, a few minutes past the hour
  workflow_dispatch:
    inputs:
      test_notify:
        description: Send a test notification instead of running a check
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: ${{ !inputs.test_notify }}
        with:
          python-version: '3.12'
          cache: pip
      - name: European ensemble tracks (optional layer)
        if: ${{ !inputs.test_notify }}
        continue-on-error: true
        run: pip install -q -r requirements.txt && python ecmwf_tracks.py
      - name: Check NHC and update status
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PLAYS_JSON: ${{ secrets.PLAYS_JSON }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
      - name: Commit updated data
        run: |
          git config user.name "gulf-storm-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "check $(date -u +%Y-%m-%dT%H:%MZ)"; git push; }
