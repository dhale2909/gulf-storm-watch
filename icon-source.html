<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#000}</style>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17304a"/><stop offset="1" stop-color="#0a1219"/></linearGradient>
    <radialGradient id="arm" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="175"><stop offset="0.3" stop-color="#ffd84a"/><stop offset="1" stop-color="#ef7f36"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- sea: a back swell, then a breaking wave with a curling crest and white wash -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7fb4"/><stop offset="1" stop-color="#143550"/></linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f98cf"/><stop offset="1" stop-color="#1a4766"/></linearGradient>
  </defs>
  <path d="M0 418 C 70 395, 110 445, 180 420 S 290 385, 350 418 S 450 450, 512 412 L512 512 L0 512 Z" fill="url(#sea)"/>
  <path d="M0 452 C 60 430, 100 470, 160 450 C 210 433, 240 400, 300 405 C 330 408, 340 440, 318 448 C 300 455, 290 440, 300 432 C 345 435, 380 470, 430 460 C 460 454, 485 438, 512 446 L512 512 L0 512 Z" fill="url(#sea2)"/>
  <!-- white wash along the crests -->
  <path d="M0 452 C 60 430, 100 470, 160 450 C 210 433, 240 400, 300 405 C 330 408, 340 440, 318 448" fill="none" stroke="#f2f8ff" stroke-width="9" stroke-linecap="round" opacity=".95"/>
  <path d="M300 432 C 345 435, 380 470, 430 460 C 460 454, 485 438, 512 446" fill="none" stroke="#f2f8ff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M0 418 C 70 395, 110 445, 180 420 S 290 385, 350 418" fill="none" stroke="#dbeafc" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <g fill="#f2f8ff"><circle cx="286" cy="422" r="6"/><circle cx="268" cy="414" r="4"/><circle cx="340" cy="456" r="5"/><circle cx="355" cy="447" r="3.5"/><circle cx="175" cy="440" r="4"/><circle cx="470" cy="446" r="4"/></g>
  <g id="cyc" transform="translate(256 222)"></g>
</svg>
<script>
// Two identical spiral arms, 180 degrees apart, each a ribbon that tapers evenly from its rounded outer end to the eye.
function arm(offset){
  var outer=[], inner=[], N=72;
  for(var i=0;i<=N;i++){
    var t=i/N, a=offset+t*Math.PI*1.3, r=160-t*96, w=40-t*22;
    outer.push([ (r+w/2)*Math.cos(a), (r+w/2)*Math.sin(a) ]);
    inner.push([ (r-w/2)*Math.cos(a), (r-w/2)*Math.sin(a) ]);
  }
  var pts=outer.concat(inner.reverse());
  var cap=[160*Math.cos(offset),160*Math.sin(offset)], tip=[64*Math.cos(offset+Math.PI*1.3),64*Math.sin(offset+Math.PI*1.3)];
  return '<path d="M'+pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' L')+' Z" fill="url(#arm)"/>'+
         '<circle cx="'+cap[0].toFixed(1)+'" cy="'+cap[1].toFixed(1)+'" r="20" fill="url(#arm)"/>'+
         '<circle cx="'+tip[0].toFixed(1)+'" cy="'+tip[1].toFixed(1)+'" r="9" fill="url(#arm)"/>';
}
document.getElementById('cyc').innerHTML=arm(Math.PI*0.62)+arm(Math.PI*1.62)+'<circle r="40" fill="#0a1219" stroke="#ffd84a" stroke-width="12"/>';
</script>
